<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/style.css"> 
    <style>
        body {
            text-align: center; padding: 50px; font-family: sans-serif; 
        }
        h1 {
            font-size: 50px; color: #333;
        }
        p {
            font-size: 20px; color: #666; 
        }
        .btn {
            display: inline-block; padding: 10px 20px; color: #fff; background: #0070f3; text-decoration: none; border-radius: 5px; margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Error 404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The link you followed might be broken, or the page may have been removed.</p>
    <a href="/" class="btn">Back to Home</a>
    <button class="btn" onclick="history.back()">Go Back</button>
    <p>
<video width="1440" height="1080" autoplay muted playsinline loop>
  <source src="resources/404.webm" type="video/webm">
</video>
</p>

</body>
</html>
